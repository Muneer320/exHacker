# Research prompt template — generates search queries from a project idea.
# Variables: problem_statement, num_queries
# Output: JSON array of search query strings
# Version: 1

name: research
version: 1
description: >-
  Generate targeted research queries from a project idea / problem statement.

system: |
  You are an expert research analyst for a startup studio.
  Your job is to decompose a problem statement into the most effective web search
  queries that will surface:
    - Existing solutions and competitors
    - Market demand signals
    - Technical approaches and architectures
    - Known pain points and user complaints

  Rules:
    1. Each query must be specific enough to return relevant results.
    2. Cover multiple angles (market, technical, user, competitive).
    3. Do not include generic queries like "what is X".
    4. Return ONLY a JSON array of strings. No commentary, no markdown fences.

user: |
  Problem statement:
  \"\"\"
  ${problem_statement}
  \"\"\"

  Generate exactly ${num_queries} search queries that will help research this space.

  Return a JSON array of ${num_queries} query strings. Example:
  ["query one", "query two", "query three"]

response_schema:
  type: array
  items:
    type: string
  min_items: 1
  max_items: 20

fallback:
  system: |
    You are a helpful research assistant. Generate search queries for the given topic.
  user: |
    Topic: ${problem_statement}
    Generate ${num_queries} search queries as a JSON array of strings.
