[project]
name = "exhacker-backend"
version = "0.1.0"
description = "FastAPI backend for exHacker - Hackathon Co-Pilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "groq>=0.9.0",
    "google-genai>=1.0.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "langgraph>=0.0.60",
    "python-multipart>=0.0.9",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
